<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; connect-src https://qbdqmgxcmqyrqiufeqgm.supabase.co; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'"
  >
  <title>MazeTrap Analytics</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #090d12;
      color: #f3f6fa;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 80% 10%, rgba(84, 215, 232, .12), transparent 28rem),
        #090d12;
    }
    main {
      width: min(520px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid #2a3849;
      border-radius: 16px;
      background: #121923;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .3);
      text-align: center;
    }
    h1 { margin: 0 0 10px; }
    p { margin: 0; color: #9fb0c3; line-height: 1.55; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border: 4px solid #2a3849;
      border-top-color: #54d7e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error .spinner { display: none; }
    .error h1 { color: #ff9a9a; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: #2a3849; }
    }
  </style>
</head>
<body>
  <main id="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Loading analytics</h1>
    <p>Opening the private MazeTrap report...</p>
  </main>
  <script>
    "use strict";
    const PROJECT_ORIGIN = "https://qbdqmgxcmqyrqiufeqgm.supabase.co";
    const REPORT_PATH =
      "/storage/v1/object/sign/analytics-reports/latest/gameplay-analytics.html";

    function fail(message) {
      const status = document.querySelector("#status");
      status.classList.add("error");
      status.querySelector("h1").textContent = "Report unavailable";
      status.querySelector("p").textContent = message;
      document.title = "MazeTrap Analytics - unavailable";
    }

    function decodeBase64Url(value) {
      const padding = "=".repeat((4 - value.length % 4) % 4);
      const binary = atob(value.replaceAll("-", "+").replaceAll("_", "/") + padding);
      return new TextDecoder().decode(Uint8Array.from(binary, character => character.charCodeAt(0)));
    }

    async function openReport() {
      const sourceValue = new URLSearchParams(location.hash.slice(1)).get("source");
      if (!sourceValue || sourceValue.length > 4096) {
        fail("This report link is incomplete.");
        return;
      }

      let source;
      try {
        source = new URL(decodeBase64Url(sourceValue));
      } catch {
        fail("This report link is invalid.");
        return;
      }
      if (
        source.origin !== PROJECT_ORIGIN ||
        source.pathname !== REPORT_PATH ||
        !source.searchParams.has("token")
      ) {
        fail("This report link is invalid.");
        return;
      }

      try {
        const response = await fetch(source, {
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer"
        });
        if (!response.ok) {
          fail(response.status === 400 || response.status === 401
            ? "This report link has expired."
            : "The report is temporarily unavailable.");
          return;
        }
        const report = await response.text();
        const blobUrl = URL.createObjectURL(new Blob([report], { type: "text/html" }));
        location.replace(blobUrl);
      } catch {
        fail("The report could not be downloaded.");
      }
    }

    void openReport();
  </script>
</body>
</html>
